    <script>
        // 页面数据
        let cardData = {};
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            loadCardData();
            initializeShare();
            showShareHint();
            
            // 如果URL包含debug参数，显示调试信息
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('debug') === '1') {
                showDebugInfo();
            }
        });
        
        // 页面可见性变化时重新设置分享
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && typeof setupWechatShare === 'function') {
                console.log('页面重新可见，重新设置微信分享');
                setTimeout(setupWechatShare, 100);
            }
        });
        
        // URL变化时重新设置分享
        window.addEventListener('popstate', function() {
            if (typeof setupWechatShare === 'function') {
                // 移除调试日志
                setTimeout(setupWechatShare, 100);
            }
        });
        
        // 加载卡片数据
        function loadCardData() {
            const urlParams = new URLSearchParams(window.location.search);
            const brandName = urlParams.get('brand') || '未知品牌';
            
            // 模拟数据（实际应该从API获取）
            cardData = {
                brand_name: decodeURIComponent(brandName),
                inspiration_origin: '这款布料设计灵感来源于传统汉文化与现代美学的完美融合，展现了东方韵味的独特魅力。',
                year: '2024',
                material: '棉麻',
                theme_series: '经典系列',
                print_size: '循环印花料',
                images: [],
                card_url: window.location.href
            };
            
            // 更新页面内容
            updatePageContent();
            
            // 从API获取实际数据
            fetchBrandData(brandName);
        }
        
        // 缓存管理器
        const cardCache = {
            get: function(key) {
                try {
                    const item = localStorage.getItem('card_' + key);
                    if (item) {
                        const data = JSON.parse(item);
                        // 检查缓存是否过期（5分钟）
                        if (Date.now() - data.timestamp < 5 * 60 * 1000) {
                            return data.value;
                        } else {
                            localStorage.removeItem('card_' + key);
                        }
                    }
                } catch (e) {
                    console.error('缓存读取失败:', e);
                }
                return null;
            },
            set: function(key, value) {
                try {
                    localStorage.setItem('card_' + key, JSON.stringify({
                        value: value,
                        timestamp: Date.now()
                    }));
                } catch (e) {
                    console.error('缓存存储失败:', e);
                }
            }
        };

        // 读取首页/详情页传入的 session 级 bootstrap 或预取结果（30 秒内有效）
        function readSessionCardPayload(brandName) {
            const keys = [
                'share_card_prefetch_' + brandName,
                'share_card_bootstrap_' + brandName
            ];
            for (let i = 0; i < keys.length; i++) {
                try {
                    const raw = sessionStorage.getItem(keys[i]);
                    if (!raw) continue;
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.value && Date.now() - parsed.timestamp < 30000) {
                        return parsed.value;
                    }
                    sessionStorage.removeItem(keys[i]);
                } catch (e) { /* ignore */ }
            }
            return null;
        }

        // 从API获取品牌数据（优化版）
        function fetchBrandData(brandName) {
            // session bootstrap / 预取：秒开卡片骨架
            const sessionPayload = readSessionCardPayload(brandName);
            if (sessionPayload) {
                cardData = { ...cardData, ...sessionPayload };
                updatePageContent();
                initializeImages();
                if (typeof sessionPayload.like_count !== 'undefined') {
                    document.getElementById('likeCount').textContent = sessionPayload.like_count;
                }
                loadLikeStatus();
                schedulePreloadImages();
            }

            // 先检查 localStorage 缓存
            const cachedData = cardCache.get(brandName);
            if (cachedData) {
                // 移除调试日志
                cardData = {
                    ...cardData,
                    ...cachedData
                };
                updatePageContent();
                initializeImages();
                // 设置点赞数
                if (typeof cachedData.like_count !== 'undefined') {
                    document.getElementById('likeCount').textContent = cachedData.like_count;
                }
                // 异步更新点赞状态
                loadLikeStatus();
                // 预加载图片
                schedulePreloadImages();
                // 有 session 数据时仍后台刷新 API，保证选图规则与点赞数最新
                if (!sessionPayload) {
                    return;
                }
            }
            
            // 缓存未命中或需后台刷新，从 API 加载
            loadFromAPI(brandName);
        }
        
        // 从API加载数据
        function loadFromAPI(brandName) {
            // 智能API路径配置 - 修复HTTPS混合内容问题
            const currentHost = window.location.hostname;
            const protocol = window.location.protocol;
            let apiBaseUrl = '';
            
            if (currentHost === 'localhost' || currentHost === '127.0.0.1') {
                // 本地开发环境，直接连接后端端口
                apiBaseUrl = `${protocol}//${currentHost}:5432`;
            } else if (currentHost.includes('nanyiqiutang.cn') || currentHost.includes('chenxiaoshivivid.com.cn')) {
                // 域名访问，使用相对路径让nginx代理处理（自动使用当前协议）
                apiBaseUrl = '';
            } else {
                // IP访问，使用当前协议
                apiBaseUrl = `${protocol}//${currentHost}:5432`;
            }
            
            // 构建完整的API URL - 正确编码品牌名
            const encodedBrandName = encodeURIComponent(brandName);
            const shareApiUrl = `${apiBaseUrl}/api/share/card/${encodedBrandName}`;
            
            // 移除调试日志
            
            // 设置请求超时
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000); // 8秒超时
            
            fetch(shareApiUrl, { signal: controller.signal })
                .then(response => {
                    clearTimeout(timeoutId);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // 兼容两种响应格式：data.card_data 或 data直接包含字段
                    const cardDataFromApi = data.data || data.card_data || data;
                    if (data.success && cardDataFromApi) {
                        
                        const newCardData = {
                            brand_name: cardDataFromApi.brand_name || cardDataFromApi.brand_name,
                            year: cardDataFromApi.year,
                            material: cardDataFromApi.material,
                            theme_series: cardDataFromApi.theme_series,
                            print_size: cardDataFromApi.print_size,
                            inspiration_origin: cardDataFromApi.inspiration_origin || '传统美学设计精髓',
                            images: cardDataFromApi.images || [],
                            like_count: cardDataFromApi.like_count || 0
                        };
                        
                        // 缓存数据
                        cardCache.set(brandName, newCardData);
                        
                        // 更新全局数据
                        cardData = {
                            ...cardData,
                            ...newCardData
                        };
                        
                        updatePageContent();
                        initializeImages();
                        
                        // 设置点赞数
                        if (typeof newCardData.like_count !== 'undefined') {
                            document.getElementById('likeCount').textContent = newCardData.like_count;
                        }
                        
                        loadLikeStatus();
                        schedulePreloadImages();
                        
                        // 每30秒刷新一次点赞状态，确保数据实时性
                        setInterval(loadLikeStatus, 30000);
                    } else {
                        console.error('API返回失败:', data.error || '未知错误');
                        // 使用默认数据，但设置正确的品牌名
                        cardData.brand_name = brandName;
                        updatePageContent();
                        loadLikeStatus();
                    }
                })
                .catch(error => {
                    clearTimeout(timeoutId);
                    console.error('获取数据失败:', error);
                    
                    if (error.name === 'AbortError') {
                        console.error('请求超时');
                    }
                    
                    // 使用默认数据，但设置正确的品牌名
                    cardData.brand_name = brandName;
                    updatePageContent();
                    loadLikeStatus();
                });
        }
        
        // 空闲时预加载图片，避免阻塞首屏渲染
        function schedulePreloadImages() {
            const run = () => preloadImages();
            if (typeof requestIdleCallback === 'function') {
                requestIdleCallback(run, { timeout: 2500 });
            } else {
                setTimeout(run, 80);
            }
        }

        // 预加载图片
        function preloadImages() {
            if (cardData.images && cardData.images.length > 0) {
                cardData.images.forEach((image, index) => {
                    let imageUrl = '';
                    if (image.medium_url && image.medium_url.startsWith('http')) {
                        imageUrl = image.medium_url;
                    } else if (image.url && image.url.startsWith('http')) {
                        imageUrl = image.url;
                    } else if (image.relative_path) {
                        const encodedPath = image.relative_path.split('/').map(part => encodeURIComponent(part)).join('/');
                        imageUrl = `/static/images/${encodedPath}`;
                    }
                    
                    if (imageUrl) {
                        const img = new Image();
                        img.onload = () => {}; // 移除调试日志
                        img.onerror = () => {}; // 移除调试日志
                        img.src = imageUrl;
                    }
                });
            }
        }
        
        // 更新页面内容
        function updatePageContent() {

        // 初始化图片展示（支持布料图多张）
        function initializeImages() {
            const imagesGrid = document.getElementById('imagesGrid');
            const imageTypes = ['概念图', '设计图', '布料图', '成衣图', '买家秀图', '模特图'];
            
            // 清空现有图片
            imagesGrid.innerHTML = '';
            
            // 按类型分组图片，布料图允许多张
            const typeImageMap = {};
            cardData.images.forEach(image => {
                if (imageTypes.includes(image.image_type)) {
                    if (!typeImageMap[image.image_type]) {
                        typeImageMap[image.image_type] = [];
                    }
                    typeImageMap[image.image_type].push(image);
                }
            });
            
            // 按指定顺序显示图片（数量由后端 /api/share/card 已筛选）
            imageTypes.forEach(type => {
                if (typeImageMap[type] && typeImageMap[type].length > 0) {
                    const imagesToShow = typeImageMap[type];
                    
                    imagesToShow.forEach((image, index) => {
                        const imageItem = document.createElement('div');
                        imageItem.className = 'image-item';
                        
                        // 处理图片URL
                        let imageUrl = '';
                        if (image.medium_url && image.medium_url.startsWith('http')) {
                            imageUrl = image.medium_url;
                        } else if (image.url && image.url.startsWith('http')) {
                            imageUrl = image.url;
                        } else if (image.relative_path) {
                            const encodedPath = image.relative_path.split('/').map(part => encodeURIComponent(part)).join('/');
                            imageUrl = `/static/images/${encodedPath}`;
                        } else {
                            imageUrl = `/static/images/${image.filename || 'placeholder.jpg'}`;
                        }
                        
                        const displayType = imagesToShow.length > 1 ?
                            `${type} ${index + 1}` : type;
                        
                        imageItem.innerHTML = `
                            <img src="${imageUrl}" alt="${displayType}" onerror="this.parentElement.style.display='none'" loading="lazy">
                            <div class="image-type">${displayType}</div>
                        `;
                        imagesGrid.appendChild(imageItem);
                    });
                }
            });
            
            // 如果没有图片，显示占位符
            if (imagesGrid.children.length === 0) {
                const placeholderItem = document.createElement('div');
                placeholderItem.className = 'image-item';
                placeholderItem.innerHTML = `
                    <img src="/static/images/placeholder.svg" alt="暂无图片" style="opacity: 0.5;">
                    <div class="image-type">暂无图片</div>
                `;
                imagesGrid.appendChild(placeholderItem);
            }
        }

        // 简单的markdown解析函数
        function parseMarkdown(text) {
            if (!text) return text;
            
            return text
                // 粗体 **text** 或 __text__
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/__(.*?)__/g, '<strong>$1</strong>')
                // 斜体 *text* 或 _text_
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/_(.*?)_/g, '<em>$1</em>')
                // 换行
                .replace(/\n/g, '<br>')
                // 简单的段落处理
                .replace(/\n\n+/g, '</p><p>')
                // 包装段落（如果有多个段落）
                .replace(/^(.*)$/s, text.includes('</p><p>') ? '<p>$1</p>' : '$1');
        }

        // 更新meta标签
        function updateMetaTags() {
            const shareData = getShareData();
            
            // 更新页面标题
            document.title = shareData.title;
            const pageTitleElement = document.getElementById('pageTitle');
            if (pageTitleElement) {
                pageTitleElement.textContent = shareData.title;
            }
            
            // 更新或创建meta标签
            const metaTags = [
                { property: 'og:title', content: shareData.title },
                { property: 'og:description', content: shareData.desc },
                { property: 'og:url', content: shareData.link },
                { property: 'og:image', content: shareData.imgUrl },
                { name: 'twitter:title', content: shareData.title },
                { name: 'twitter:description', content: shareData.desc },
                { name: 'twitter:image', content: shareData.imgUrl },
                { itemprop: 'name', content: shareData.title },
                { itemprop: 'description', content: shareData.desc },
                { itemprop: 'image', content: shareData.imgUrl },
                { name: 'wechat:title', content: shareData.title },
                { name: 'wechat:desc', content: shareData.desc },
                { name: 'wechat:imgUrl', content: shareData.imgUrl },
                { name: 'wechat:link', content: shareData.link },
                { name: 'weixin:appmsg_title', content: shareData.title },
                { name: 'weixin:appmsg_desc', content: shareData.desc },
                { name: 'weixin:timeline_title', content: shareData.timelineTitle || shareData.title },
                { name: 'weixin:timeline_desc', content: shareData.desc },
                { name: 'weixin:img_url', content: shareData.imgUrl }
            ];
            
            metaTags.forEach(tag => {
                let selector = '';
                if (tag.property) {
                    selector = `meta[property="${tag.property}"]`;
                } else if (tag.name) {
                    selector = `meta[name="${tag.name}"]`;
                } else if (tag.itemprop) {
                    selector = `meta[itemprop="${tag.itemprop}"]`;
                }
                
                let metaElement = document.querySelector(selector);
                if (metaElement) {
                    metaElement.setAttribute('content', tag.content);
                } else {
                    metaElement = document.createElement('meta');
                    if (tag.property) metaElement.setAttribute('property', tag.property);
                    if (tag.name) metaElement.setAttribute('name', tag.name);
                    if (tag.itemprop) metaElement.setAttribute('itemprop', tag.itemprop);
                    metaElement.setAttribute('content', tag.content);
                    document.head.appendChild(metaElement);
                }
            });
        }
        
        // 显示调试信息
        function showDebugInfo() {
            const debugPanel = document.createElement('div');
            debugPanel.id = 'debug-panel';
            debugPanel.style.cssText = `
                position: fixed;
                top: 10px;
                right: 10px;
                width: 300px;
                background: rgba(0, 0, 0, 0.9);
                color: white;
                padding: 15px;
                border-radius: 10px;
                font-size: 12px;
                z-index: 10000;
                max-height: 400px;
                overflow-y: auto;
            `;
            
            const isWeChat = isWechatBrowser();
            const hasWxSDK = typeof wx !== 'undefined';
            
            debugPanel.innerHTML = `
                <div style="font-weight: bold; margin-bottom: 10px;">🐛 调试信息</div>
                <div>浏览器：${isWeChat ? '✅ 微信' : '❌ 非微信'}</div>
                <div>微信SDK：${hasWxSDK ? '✅ 已加载' : '❌ 未加载'}</div>
                <div>页面标题：${document.title}</div>
                <div>当前URL：${window.location.href}</div>
                <div style="margin-top: 10px;">
                    <button onclick="testShareConfig()" style="background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">测试分享配置</button>
                    <button onclick="document.getElementById('debug-panel').remove()" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-left: 5px;">关闭</button>
                </div>
                <div id="debug-log" style="margin-top: 10px; max-height: 200px; overflow-y: auto; background: rgba(255,255,255,0.1); padding: 5px; border-radius: 5px;"></div>
            `;
            
            document.body.appendChild(debugPanel);
            
            // 重写console.log以显示在调试面板中
            const originalLog = console.log;
            console.log = function(...args) {
                originalLog.apply(console, args);
                const debugLog = document.getElementById('debug-log');
                if (debugLog) {
                    const logEntry = document.createElement('div');
                    logEntry.textContent = args.join(' ');
                    logEntry.style.marginBottom = '2px';
                    debugLog.appendChild(logEntry);
                    debugLog.scrollTop = debugLog.scrollHeight;
                }
            };
        }
        
        // 测试分享配置
        function testShareConfig() {
            const debugLog = document.getElementById('debug-log');
            if (debugLog) {
                debugLog.innerHTML = '';
            }
            
            // 移除调试日志
            const shareData = getShareData();
            
            // 检查meta标签
            const metaTags = [
                'og:title', 'og:description', 'og:image', 'og:url',
                'twitter:title', 'twitter:description', 'twitter:image',
                'wechat:title', 'wechat:desc', 'wechat:imgUrl'
            ];
            
            console.log('=== Meta标签检查 ===');
            metaTags.forEach(tag => {
                const element = document.querySelector(`meta[property="${tag}"], meta[name="${tag}"]`);
                if (element) {
                    console.log(`${tag}: ${element.getAttribute('content')}`);
                } else {
                    console.log(`${tag}: 未找到`);
                }
            });
            
            if (isWechatBrowser() && typeof wx !== 'undefined') {
                console.log('=== 微信分享测试 ===');
                setupWechatShare();
            }
        }
    </script>
