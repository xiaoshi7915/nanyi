# 南意秋棠服务日志轮转配置
# 将此文件复制到 /etc/logrotate.d/nanyi-products

/opt/hanfu/products/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    notifempty
    missingok
    create 0644 root root
    sharedscripts
    postrotate
        # 通知systemd服务重新打开日志文件
        systemctl reload nanyi-backend.service > /dev/null 2>&1 || true
        systemctl reload nanyi-frontend.service > /dev/null 2>&1 || true
    endscript
}

# Systemd日志轮转（journald自动管理）
# 配置在 /etc/systemd/journald.conf
